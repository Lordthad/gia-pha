# Tự dựng lại website mỗi khi dữ liệu gia phả được đưa lên kho.
name: Dua gia pha len GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Không huỷ bản đang dựng dở, tránh mất một lần cập nhật dữ liệu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dung:
    name: Dung website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  trien-khai:
    name: Dua len mang
    needs: dung
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
